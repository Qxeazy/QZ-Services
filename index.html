  const equal = (a,b) => a.length === b.length && a.every((v,i) => v === b[i]);
  async function verify(value) {
    const key = await crypto.subtle.importKey('raw', encoder.encode(value), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64bytes(AUTH.salt),iterations:AUTH.iterations,hash:'SHA-256'}, key, 256);
    return equal(new Uint8Array(bits), b64bytes(AUTH.verifier));
  }
  function discoverServices() {
    return [...document.querySelectorAll('.offer-card[data-testid]')].map(card => {
      const no = card.dataset.testid.replace('service-','');
      const title = card.querySelector('h3')?.textContent.trim() || no;
      const priceNode = card.querySelector('.offer-price');
      return { no, title, price: priceNode?.childNodes[0]?.textContent.trim() || '—', status: priceNode?.querySelector('small')?.textContent.trim() || 'verfügbar' };
    });
  }
  function syncPreview() {
    services.forEach(service => {
      const card = document.querySelector(`[data-testid="service-${service.no}"]`);
      const price = card?.querySelector('.offer-price');
      if (price) { if (price.firstChild) price.firstChild.textContent = service.price; else price.prepend(document.createTextNode(service.price)); const small = price.querySelector('small'); if (small) small.textContent = service.status; }
      const row = [...document.querySelectorAll('.offers-table tbody tr')][Number(service.no)-1];
      if (row) { const cells = row.querySelectorAll('td'); if (cells[1]) cells[1].textContent = service.price; const state = row.querySelector('.table-status'); if (state) state.textContent = service.status; }
    });
  }
  function button(text, primary) { const node = document.createElement('button'); node.type='button'; node.className = `qz-mini-button${primary?' primary':''}`; node.textContent=text; return node; }
  function open() { overlay.classList.add('is-open'); document.body.style.overflow='hidden'; authenticated ? renderEditor() : renderLogin(); overlay.querySelector('input,button')?.focus(); }
  function close() { overlay.classList.remove('is-open'); document.body.style.overflow=''; }
  function renderLogin() {
    overlay.querySelector('.qz-mini-body').replaceChildren();
    const body=overlay.querySelector('.qz-mini-body'), kicker=document.createElement('p'); kicker.className='qz-mini-kicker'; kicker.textContent='QZ // Besitzerbereich';
    const title=document.createElement('h2'); title.className='qz-mini-title'; title.textContent='Preise verwalten.';
    const copy=document.createElement('p'); copy.className='qz-mini-copy'; copy.textContent='Dieses kleine Fenster ist nur für die Verwaltung. Die eigentliche Website bleibt unverändert.';
    const note=document.createElement('div'); note.className='qz-mini-note'; note.textContent='Bitte gib deinen Verwaltungscode ein. Im HTML steht kein Klartext-Passwort, sondern nur ein kryptografischer Prüfwert.';
    const form=document.createElement('form'); form.className='qz-mini-form'; const label=document.createElement('label'); label.className='qz-mini-label'; label.textContent='Verwaltungscode'; const input=document.createElement('input'); input.className='qz-mini-input'; input.type='password'; input.autocomplete='current-password'; input.required=true; input.placeholder='Code eingeben'; label.append(input);
    const error=document.createElement('p'); error.className='qz-mini-error'; const actions=document.createElement('div'); actions.className='qz-mini-actions'; const unlock=button('Entsperren',true); const cancel=button('Abbrechen'); cancel.addEventListener('click',close); actions.append(unlock,cancel); form.append(label,error,actions);
    form.addEventListener('submit',async event=>{event.preventDefault(); error.textContent=''; unlock.disabled=true; unlock.textContent='Prüfe …'; try { if(await verify(input.value)){authenticated=true; services=discoverServices(); renderEditor();} else error.textContent='Der Verwaltungscode ist nicht korrekt.';} catch(e){error.textContent='Die Verifikation ist in diesem Browser nicht verfügbar.';} finally{unlock.disabled=false; unlock.textContent='Entsperren';}});
    body.append(kicker,title,copy,note,form);
  }
  function renderEditor() {
    overlay.querySelector('.qz-mini-body').replaceChildren(); const body=overlay.querySelector('.qz-mini-body'); const kicker=document.createElement('p'); kicker.className='qz-mini-kicker'; kicker.textContent='QZ // Besitzerbereich'; const title=document.createElement('h2'); title.className='qz-mini-title'; title.textContent='Preise & Status.'; const copy=document.createElement('p'); copy.className='qz-mini-copy'; copy.textContent='Ändere nur die Werte. Die Vorschau auf der Original-Website wird sofort aktualisiert.'; const list=document.createElement('div'); list.className='qz-mini-list';
    services.forEach(service=>{const row=document.createElement('div'); row.className='qz-mini-row'; const name=document.createElement('div'); name.className='qz-mini-service'; const id=document.createElement('span'); id.textContent=`${service.no} // service`; const strong=document.createElement('b'); strong.textContent=service.title; name.append(id,strong); const pfield=document.createElement('label'); pfield.className='qz-mini-field'; pfield.textContent='Preis'; const price=document.createElement('input'); price.value=service.price; pfield.append(price); const sfield=document.createElement('label'); sfield.className='qz-mini-field'; sfield.textContent='Verfügbarkeit'; const select=document.createElement('select'); statuses.forEach(status=>{const option=document.createElement('option'); option.value=status; option.textContent=status; option.selected=service.status===status; select.append(option);}); sfield.append(select); row.append(name,pfield,sfield); list.append(row); price.addEventListener('input',()=>{service.price=price.value.trim()||'—';syncPreview();}); select.addEventListener('change',()=>{service.status=select.value;syncPreview();});});
    const actions=document.createElement('div'); actions.className='qz-mini-actions'; const download=button('Neue index.html laden',true); const closeButton=button('Schließen'); closeButton.addEventListener('click',close); download.addEventListener('click',downloadHtml); actions.append(download,closeButton); const security=document.createElement('p'); security.className='qz-mini-security'; security.textContent='GitHub Pages bleibt statisch: Die Verwaltung schützt das Fenster vor normalem Zugriff, ersetzt aber keine Repository-Zugriffsrechte.'; body.append(kicker,title,copy,list,actions,security);
  }
  function downloadHtml() {
    const clone=document.documentElement.cloneNode(true); const data=clone.querySelector('#qz-service-settings') || document.createElement('script'); data.id='qz-service-settings'; data.type='application/json'; data.textContent=JSON.stringify({services:services.map(({no,price,status})=>({no,price,status}))}).replace(/</g,'\\u003c'); if(!data.parentNode) clone.querySelector('head').prepend(data); const html='<!DOCTYPE html>\n'+clone.outerHTML; const url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'})); const link=document.createElement('a'); link.href=url; link.download='index.html'; document.body.append(link); link.click(); link.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  function boot() {
    overlay=document.createElement('div'); overlay.className='qz-mini-overlay'; overlay.innerHTML='<section class="qz-mini-window" role="dialog" aria-modal="true" aria-labelledby="qz-mini-title"><div class="qz-mini-head"><strong id="qz-mini-title">Preise verwalten</strong><button class="qz-mini-close" type="button" aria-label="Fenster schließen">×</button></div><div class="qz-mini-body"></div></section>'; document.body.append(overlay); overlay.querySelector('.qz-mini-close').addEventListener('click',close); overlay.addEventListener('mousedown',event=>{if(event.target===overlay)close();}); document.addEventListener('keydown',event=>{if(event.key==='Escape'&&overlay.classList.contains('is-open'))close();});
    const attachFooterLink=()=>{const link=[...document.querySelectorAll('footer a')].find(a=>a.getAttribute('href')==='#verwalten'); if(!link||link.dataset.qzMiniBound)return Boolean(link); link.dataset.qzMiniBound='true'; link.addEventListener('click',event=>{event.preventDefault();event.stopPropagation();open();},true); return true;};
    if(!attachFooterLink()){const observer=new MutationObserver(()=>{if(attachFooterLink())observer.disconnect();}); observer.observe(document.body,{childList:true,subtree:true});}
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>
